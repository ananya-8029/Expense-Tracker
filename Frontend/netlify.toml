[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (React Router) don't 404 on refresh/deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow the Google OAuth popup to interact with the opener (silences COOP
# "window.closed" warnings from Google Identity Services)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
